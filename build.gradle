buildscript {
    ext {
        compileSdkVersion = 36
        minSdkVersion = 35
        targetSdkVersion = 36

        activityComposeVersion = '1.10.0'
        appCompatVersion = '1.7.0'
        benchmarkVersion = '1.3.3'
        coilVersion = '2.7.0'
        composeThemeAdapterVersion = '1.2.1'
        composeVersion = '1.7.8'
        constraintLayoutComposeVersion = '1.1.0'
        constraintLayoutVersion = '2.2.0'
        coreTestingVersion = '2.2.0'
        coroutinesVersion = '1.10.2'
        espressoVersion = '3.6.1'
        fragmentVersion = '1.8.6'
        gradleVersion = '9.1.1'
        gsonVersion = '2.11.0'
        hiltVersion = '2.57.2'
        junitVersion = '4.13.2'
        kotlinVersion = '2.1.10'
        ktlintVersion = '0.50.0'
        ktxVersion = '1.15.0'
        lifecycleVersion = '2.8.8'
        materialVersion = '1.13.0'
        navigationVersion = '2.9.6'
        okhttpLoggingVersion = '4.12.0'
        pagingVersion = '3.3.6'
        profileInstallerVersion = '1.4.1'
        recyclerViewVersion = '1.3.2'
        retrofitVersion = '2.11.0'
        roomVersion = '2.8.4'
        runnerVersion = '1.6.2'
        testExtJunit = '1.2.1'
        tracingVersion = '1.3.0'
        truthVersion = '1.4.4'
        uiAutomatorVersion = '2.3.0'
        viewModelComposeVersion = '2.8.8'
        viewPagerVersion = '1.1.0'
        workVersion = '2.10.0'
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$navigationVersion"
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hiltVersion"
        classpath 'com.google.android.gms:oss-licenses-plugin:0.10.6'
    }
}

plugins {
    id "com.android.application" version "$gradleVersion" apply false
    id "com.android.library" version "$gradleVersion" apply false
    id "org.jetbrains.kotlin.android" version "$kotlinVersion" apply false
    id "com.diffplug.spotless" version "6.25.0"
    id "org.jlleitschuh.gradle.ktlint" version "12.1.1"
    id 'com.google.devtools.ksp' version '2.3.2' apply false
    //id 'com.google.gms.google-services' version '4.4.2' apply false
    id "org.jetbrains.kotlin.plugin.parcelize" version "$kotlinVersion" apply false
    id 'org.jetbrains.kotlin.multiplatform' version "$kotlinVersion" apply false
    id 'org.jetbrains.kotlin.plugin.serialization' version "$kotlinVersion" apply false
    id 'com.google.dagger.hilt.android' version "$hiltVersion" apply false
}

spotless {
    kotlin {
        target "**/*.kt"
        ktlint(ktlintVersion).userData(['max_line_length': '100'])
    }
}
